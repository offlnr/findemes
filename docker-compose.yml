# Local development database. Same major version as Amazon RDS for PostgreSQL in production (18).
# Credentials here are for local development only; real environments use secrets.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: findemes
      POSTGRES_USER: findemes_owner
      POSTGRES_PASSWORD: local_owner_password
    ports:
      # Bound to localhost only: the database is never reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U findemes_owner -d findemes']
      interval: 2s
      timeout: 3s
      retries: 30

  # Test environment for transactional email: catches every message sent over SMTP and shows it
  # at http://localhost:8025. Nothing leaves the machine. Production uses Amazon SES over SMTP.
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

volumes:
  db-data:
