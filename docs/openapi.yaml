  /v1/household/expenses:
    post:
      summary: Registrar un gasto común (HU13, HU14)
      tags: *a11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - label
                - amount
                - schedule
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 80
                amount:
                  type: integer
                  minimum: 1
                  maximum: 1000000000000
                schedule:
                  description: "Periodicidad (HU01): un solo mes, todos los meses o cada N meses
                    desde el mes de inicio. until null = sin término."
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required:
                        - kind
                        - month
                      properties:
                        kind:
                          type: string
                          enum:
                            - once
                        month:
                          type: string
                          pattern: ^\d{4}-(0[1-9]|1[0-2])$
                          examples:
                            - 2026-11
                    - type: object
                      additionalProperties: false
                      required:
                        - kind
                        - from
                        - until
                      properties:
                        kind:
                          type: string
                          enum:
                            - monthly
                        from:
                          type: string
                          pattern: ^\d{4}-(0[1-9]|1[0-2])$
                          examples:
                            - 2026-11
                        until:
                          anyOf:
                            - type: string
                              pattern: ^\d{4}-(0[1-9]|1[0-2])$
                              examples:
                                - 2026-11
                            - type: "null"
                    - type: object
                      additionalProperties: false
                      required:
                        - kind
                        - intervalMonths
                        - from
                        - until
                      properties:
                        kind:
                          type: string
                          enum:
                            - every_n_months
                        intervalMonths:
                          type: integer
                          minimum: 2
                          maximum: 24
                        from:
                          type: string
                          pattern: ^\d{4}-(0[1-9]|1[0-2])$
                          examples:
                            - 2026-11
                        until:
                          anyOf:
                            - type: string
                              pattern: ^\d{4}-(0[1-9]|1[0-2])$
                              examples:
                                - 2026-11
                            - type: "null"
                rule:
                  description: Regla de aporte (HU14). Sin regla, el gasto se reparte en partes
                    iguales. Porcentajes en puntos base (10000 = 100 %).
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required:
                        - mode
                      properties:
                        mode:
                          type: string
                          enum:
                            - equal
                    - type: object
                      additionalProperties: false
                      required:
                        - mode
                        - userId
                      properties:
                        mode:
                          type: string
                          enum:
                            - assigned
                        userId:
                          type: string
                          format: uuid
                    - type: object
                      additionalProperties: false
                      required:
                        - mode
                        - shares
                      properties:
                        mode:
                          type: string
                          enum:
                            - percentage
                        shares:
                          type: array
                          minItems: 1
                          maxItems: 20
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - userId
                              - basisPoints
                            properties:
                              userId:
                                type: string
                                format: uuid
                              basisPoints:
                                type: integer
                                minimum: 1
                                maximum: 10000
