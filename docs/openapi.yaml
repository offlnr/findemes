  /v1/auth/password:
    post:
      summary: Cambiar la contraseña (HU17.4)
      tags: *a2
      description: Exige la contraseña vigente, cierra las otras sesiones y avisa por
        correo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 512
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 512
                client:
                  type: string
                  enum:
                    - web
                    - mobile
                  description: "web: el refresh token y el dispositivo viajan en cookies HttpOnly.
                    mobile: en el cuerpo (flutter_secure_storage)."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - accessToken
                  - accessTokenExpiresAt
                properties:
                  accessToken:
                    type: string
                    description: JWT de 15 minutos; en la web se guarda solo en memoria.
                  accessTokenExpiresAt:
                    type: string
                    format: date-time
                  refreshToken:
                    type: string
                    description: Solo para clientes mobile.
                  refreshTokenExpiresAt:
                    type: string
                    format: date-time
                  deviceId:
                    type: string
                    description: Solo para clientes mobile.
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                  - issues
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_fields
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - field
                        - message
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
