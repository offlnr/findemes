  /v1/household:
    get:
      summary: "Mi hogar: integrantes, gastos comunes y mi aporte (HU12-HU15)"
      tags: &a11
        - hogar
      description: household es null si no perteneces a un hogar. No incluye datos
        individuales de ningún integrante.
      security: &a12
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - household
                properties:
                  household:
                    anyOf:
                      - type: object
                        additionalProperties: false
                        required:
                          - id
                          - name
                          - myRole
                          - readOnly
                          - members
                          - expenses
                          - myMonthlyContribution
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          myRole:
                            type: string
                            enum:
                              - admin
                              - member
                          readOnly:
                            type: boolean
                            description: "HU20: ningún integrante tiene un plan Familiar vigente."
                          members:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required:
                                - userId
                                - displayName
                                - role
                                - isMe
                              properties:
                                userId:
                                  type: string
                                  format: uuid
                                displayName:
                                  type: string
                                role:
                                  type: string
                                  enum:
                                    - admin
                                    - member
                                isMe:
                                  type: boolean
                          expenses:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required:
                                - id
                                - label
                                - amount
                                - schedule
                                - rule
                                - createdByName
                                - canEdit
                                - myShare
                                - shares
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                label:
                                  type: string
                                amount:
                                  type: integer
                                schedule:
                                  description: "Periodicidad (HU01): un solo mes, todos los meses o cada N meses
                                    desde el mes de inicio. until null = sin
                                    término."
                                  oneOf:
                                    - type: object
                                      additionalProperties: false
                                      required:
                                        - kind
                                        - month
                                      properties:
                                        kind:
                                          type: string
                                          enum:
                                            - once
                                        month:
                                          type: string
                                          pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                          examples:
                                            - 2026-11
                                    - type: object
                                      additionalProperties: false
                                      required:
                                        - kind
                                        - from
                                        - until
                                      properties:
                                        kind:
                                          type: string
                                          enum:
                                            - monthly
                                        from:
                                          type: string
                                          pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                          examples:
                                            - 2026-11
                                        until:
                                          anyOf:
                                            - type: string
                                              pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                              examples:
                                                - 2026-11
                                            - type: "null"
                                    - type: object
                                      additionalProperties: false
                                      required:
                                        - kind
                                        - intervalMonths
                                        - from
                                        - until
                                      properties:
                                        kind:
                                          type: string
                                          enum:
                                            - every_n_months
                                        intervalMonths:
                                          type: integer
                                          minimum: 2
                                          maximum: 24
                                        from:
                                          type: string
                                          pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                          examples:
                                            - 2026-11
                                        until:
                                          anyOf:
                                            - type: string
                                              pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                              examples:
                                                - 2026-11
                                            - type: "null"
                                rule:
                                  description: Regla de aporte (HU14). Sin regla, el gasto se reparte en partes
                                    iguales. Porcentajes en puntos base (10000 =
                                    100 %).
                                  oneOf:
                                    - type: object
                                      additionalProperties: false
                                      required:
                                        - mode
                                      properties:
                                        mode:
                                          type: string
                                          enum:
                                            - equal
                                    - type: object
                                      additionalProperties: false
                                      required:
                                        - mode
                                        - userId
                                      properties:
                                        mode:
                                          type: string
                                          enum:
                                            - assigned
                                        userId:
                                          type: string
                                          format: uuid
                                    - type: object
                                      additionalProperties: false
                                      required:
                                        - mode
                                        - shares
                                      properties:
                                        mode:
                                          type: string
                                          enum:
                                            - percentage
                                        shares:
                                          type: array
                                          minItems: 1
                                          maxItems: 20
                                          items:
                                            type: object
                                            additionalProperties: false
                                            required:
                                              - userId
                                              - basisPoints
                                            properties:
                                              userId:
                                                type: string
                                                format: uuid
                                              basisPoints:
                                                type: integer
                                                minimum: 1
                                                maximum: 10000
                                createdByName:
                                  type: string
                                  description: Quién lo registró (HU13).
                                canEdit:
                                  type: boolean
                                myShare:
                                  type: integer
                                  description: Mi aporte mensual a este gasto (HU15).
                                shares:
                                  type: array
                                  items:
                                    type: object
                                    additionalProperties: false
                                    required:
                                      - userId
                                      - amount
                                    properties:
                                      userId:
                                        type: string
                                        format: uuid
                                      amount:
                                        type: integer
                          myMonthlyContribution:
                            type: integer
                            description: Suma de mis aportes a los gastos mensuales.
                      - type: "null"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
    post:
      summary: Crear un hogar (HU12)
      tags: *a11
