openapi: 3.1.0
info:
  title: Fin de Mes — API pública
  description: API REST versionada de Fin de Mes. Las rutas administrativas no
    forman parte de esta API.
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /health:
    get:
      summary: Estado del servicio
      tags:
        - infraestructura
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /v1/demo/examples:
    get:
      summary: Ejemplos ficticios del modo demostración
      tags: &a1
        - modo demostración
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - id
                    - name
                    - description
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
  /v1/demo/projection:
    post:
      summary: Proyección del modo demostración
      tags: *a1
      description: Calcula la proyección de un estado base de demostración con a lo
        más 1 decisión. Con datos propios proyecta 3 meses; con un ejemplo, 12.
        No guarda ni registra los datos enviados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - base
              properties:
                base:
                  description: "Estado base: un ejemplo ficticio (HU27) o los datos mínimos del
                    visitante (HU28)."
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required:
                        - example
                      properties:
                        example:
                          type: string
                          enum:
                            - estudiante
                            - familia
                            - profesional
                    - type: object
                      additionalProperties: false
                      required:
                        - openingBalance
                        - monthlyIncome
                        - monthlyFixedExpense
                      properties:
                        openingBalance:
                          type: integer
                          minimum: -1000000000000
                          maximum: 1000000000000
                        monthlyIncome:
                          type: integer
                          minimum: 0
                          maximum: 1000000000000
                        monthlyFixedExpense:
                          type: integer
                          minimum: 0
                          maximum: 1000000000000
                decision:
                  description: Una decisión del catálogo (Tabla 11). Sus parámetros los valida el
                    motor; los meses usan el formato AAAA-MM.
                  anyOf:
                    - type: object
                      additionalProperties: false
                      required:
                        - kind
                        - params
                      properties:
                        kind:
                          type: string
                          enum:
                            - purchase_in_installments
                            - fixed_expense_change
                            - one_off_expense
                            - debt_prepayment
                            - income_variation
                        params:
                          type: object
                    - type: "null"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - origin
                  - startMonth
                  - horizonMonths
                  - entries
                  - base
                  - scenario
                  - variation
                  - explanation
                  - limitNotice
                properties:
                  origin:
                    type: string
                    enum:
                      - demo
                    description: Los datos son de demostración y no se guardan.
                  startMonth:
                    type: string
                  horizonMonths:
                    type: integer
                  entries:
                    type: object
                    properties:
                      openingBalance:
                        type: integer
                      incomes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            amount:
                              type: integer
                          required:
                            - id
                            - label
                            - amount
                          additionalProperties: false
                      expenses:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            amount:
                              type: integer
                            nature:
                              type: string
                              enum:
                                - fixed
                                - variable_estimate
                          required:
                            - id
                            - label
                            - amount
                            - nature
                          additionalProperties: false
                      debts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            installments:
                              type: array
                              items:
                                type: object
                                properties:
                                  month:
                                    type: string
                                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                    examples:
                                      - 2026-11
                                  amount:
                                    type: integer
                                required:
                                  - month
                                  - amount
                                additionalProperties: false
                          required:
                            - id
                            - label
                            - installments
                          additionalProperties: false
                    required:
                      - openingBalance
                      - incomes
                      - expenses
                      - debts
                    additionalProperties: false
                  base:
                    type: object
                    properties:
                      months:
                        type: array
                        items:
                          type: object
                          properties:
                            month:
                              type: string
                              pattern: ^\d{4}-(0[1-9]|1[0-2])$
                              examples:
                                - 2026-11
                            openingBalance:
                              type: integer
                            income:
                              type: integer
                            expenses:
                              type: integer
                            debtPayments:
                              type: integer
                            netFlow:
                              type: integer
                            closingBalance:
                              type: integer
                          required:
                            - month
                            - openingBalance
                            - income
                            - expenses
                            - debtPayments
                            - netFlow
                            - closingBalance
                          additionalProperties: false
                      indicators:
                        type: object
                        description: Indicadores de la Tabla 12.
                        properties:
                          minimumProjectedBalance:
                            type: object
                            description: Saldo mínimo proyectado y primer mes en que ocurre.
                            properties:
                              amount:
                                type: integer
                              month:
                                type: string
                                pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                examples:
                                  - 2026-11
                            required:
                              - amount
                              - month
                            additionalProperties: false
                          breakMonth:
                            anyOf:
                              - type: string
                                pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                examples:
                                  - 2026-11
                              - type: "null"
                            description: Primer mes con saldo negativo; null si no ocurre.
                          monthlyAvailableMargin:
                            type: array
                            items:
                              type: object
                              properties:
                                month:
                                  type: string
                                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                  examples:
                                    - 2026-11
                                amount:
                                  type: integer
                              required:
                                - month
                                - amount
                              additionalProperties: false
                            description: Ingresos menos compromisos totales de cada mes.
                          debtToIncome:
                            type: array
                            description: Puntos básicos enteros (10 000 = 100 %); null si el mes no tiene
                              ingresos.
                            items:
                              type: object
                              properties:
                                month:
                                  type: string
                                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                  examples:
                                    - 2026-11
                                basisPoints:
                                  anyOf:
                                    - type: integer
                                    - type: "null"
                              required:
                                - month
                                - basisPoints
                              additionalProperties: false
                        required:
                          - minimumProjectedBalance
                          - breakMonth
                          - monthlyAvailableMargin
                          - debtToIncome
                        additionalProperties: false
                    required:
                      - months
                      - indicators
                    additionalProperties: false
                  scenario:
                    anyOf:
                      - type: object
                        properties:
                          months:
                            type: array
                            items:
                              type: object
                              properties:
                                month:
                                  type: string
                                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                  examples:
                                    - 2026-11
                                openingBalance:
                                  type: integer
                                income:
                                  type: integer
                                expenses:
                                  type: integer
                                debtPayments:
                                  type: integer
                                netFlow:
                                  type: integer
                                closingBalance:
                                  type: integer
                              required:
                                - month
                                - openingBalance
                                - income
                                - expenses
                                - debtPayments
                                - netFlow
                                - closingBalance
                              additionalProperties: false
                          indicators:
                            type: object
                            description: Indicadores de la Tabla 12.
                            properties:
                              minimumProjectedBalance:
                                type: object
                                description: Saldo mínimo proyectado y primer mes en que ocurre.
                                properties:
                                  amount:
                                    type: integer
                                  month:
                                    type: string
                                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                    examples:
                                      - 2026-11
                                required:
                                  - amount
                                  - month
                                additionalProperties: false
                              breakMonth:
                                anyOf:
                                  - type: string
                                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                    examples:
                                      - 2026-11
                                  - type: "null"
                                description: Primer mes con saldo negativo; null si no ocurre.
                              monthlyAvailableMargin:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    month:
                                      type: string
                                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                      examples:
                                        - 2026-11
                                    amount:
                                      type: integer
                                  required:
                                    - month
                                    - amount
                                  additionalProperties: false
                                description: Ingresos menos compromisos totales de cada mes.
                              debtToIncome:
                                type: array
                                description: Puntos básicos enteros (10 000 = 100 %); null si el mes no tiene
                                  ingresos.
                                items:
                                  type: object
                                  properties:
                                    month:
                                      type: string
                                      pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                      examples:
                                        - 2026-11
                                    basisPoints:
                                      anyOf:
                                        - type: integer
                                        - type: "null"
                                  required:
                                    - month
                                    - basisPoints
                                  additionalProperties: false
                            required:
                              - minimumProjectedBalance
                              - breakMonth
                              - monthlyAvailableMargin
                              - debtToIncome
                            additionalProperties: false
                        required:
                          - months
                          - indicators
                        additionalProperties: false
                      - type: "null"
                    description: null cuando no se aplica una decisión.
                  variation:
                    anyOf:
                      - type: object
                        description: "Diferencia de cada indicador: escenario menos base. No indica qué
                          resultado es preferible."
                        properties:
                          minimumProjectedBalance:
                            type: integer
                          breakMonth:
                            type: object
                            properties:
                              base:
                                anyOf:
                                  - type: string
                                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                    examples:
                                      - 2026-11
                                  - type: "null"
                              scenario:
                                anyOf:
                                  - type: string
                                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                    examples:
                                      - 2026-11
                                  - type: "null"
                            required:
                              - base
                              - scenario
                            additionalProperties: false
                          monthlyAvailableMargin:
                            type: array
                            items:
                              type: object
                              properties:
                                month:
                                  type: string
                                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                  examples:
                                    - 2026-11
                                amount:
                                  type: integer
                              required:
                                - month
                                - amount
                              additionalProperties: false
                          debtToIncome:
                            type: array
                            description: Puntos básicos enteros (10 000 = 100 %); null si el mes no tiene
                              ingresos.
                            items:
                              type: object
                              properties:
                                month:
                                  type: string
                                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                  examples:
                                    - 2026-11
                                basisPoints:
                                  anyOf:
                                    - type: integer
                                    - type: "null"
                              required:
                                - month
                                - basisPoints
                              additionalProperties: false
                        required:
                          - minimumProjectedBalance
                          - breakMonth
                          - monthlyAvailableMargin
                          - debtToIncome
                        additionalProperties: false
                      - type: "null"
                  explanation:
                    type: object
                    properties:
                      summary:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                      - summary
                      - details
                    additionalProperties: false
                  limitNotice:
                    type: string
                    description: Qué se habilita al crear una cuenta (HU28).
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                  - issues
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_decision
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
                      required:
                        - field
                        - message
                      additionalProperties: false
  /v1/auth/register:
    post:
      summary: Crear una cuenta (HU17)
      tags: &a2
        - identidad y sesión
      description: La respuesta es la misma exista o no una cuenta con ese correo; se
        envía un enlace de verificación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 512
                displayName:
                  type: string
                  maxLength: 80
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - message
                properties:
                  message:
                    type: string
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - field
                        - message
                      properties:
                        field:
                          type: string
                        message:
                          type: string
                  fields:
                    type: array
                    items:
                      type: string
  /v1/auth/verify-email:
    post:
      summary: Confirmar el correo (HU17)
      tags: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]+$
      responses:
        "204":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - field
                        - message
                      properties:
                        field:
                          type: string
                        message:
                          type: string
                  fields:
                    type: array
                    items:
                      type: string
  /v1/auth/login:
    post:
      summary: Iniciar sesión (HU17.1, CU-11)
      tags: *a2
      description: Un dispositivo no reconocido recibe un código por correo y debe
        confirmarlo en /v1/auth/login/code. Correo inexistente y contraseña
        incorrecta reciben la misma respuesta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 512
                client:
                  type: string
                  enum:
                    - web
                    - mobile
                  description: "web: el refresh token y el dispositivo viajan en cookies HttpOnly.
                    mobile: en el cuerpo (flutter_secure_storage)."
                deviceId:
                  type: string
                  minLength: 16
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]+$
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - status
                      - session
                    properties:
                      status:
                        type: string
                        enum:
                          - authenticated
                      session:
                        type: object
                        additionalProperties: false
                        required:
                          - accessToken
                          - accessTokenExpiresAt
                        properties:
                          accessToken:
                            type: string
                            description: JWT de 15 minutos; en la web se guarda solo en memoria.
                          accessTokenExpiresAt:
                            type: string
                            format: date-time
                          refreshToken:
                            type: string
                            description: Solo para clientes mobile.
                          refreshTokenExpiresAt:
                            type: string
                            format: date-time
                          deviceId:
                            type: string
                            description: Solo para clientes mobile.
                  - type: object
                    additionalProperties: false
                    required:
                      - status
                      - challengeId
                    properties:
                      status:
                        type: string
                        enum:
                          - code_required
                      challengeId:
                        type: string
                      deviceId:
                        type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /v1/auth/login/code:
    post:
      summary: Confirmar el código de inicio de sesión (CU-11)
      tags: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challengeId
                - code
              properties:
                challengeId:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: ^\d{6}$
                client:
                  type: string
                  enum:
                    - web
                    - mobile
                  description: "web: el refresh token y el dispositivo viajan en cookies HttpOnly.
                    mobile: en el cuerpo (flutter_secure_storage)."
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - accessToken
                  - accessTokenExpiresAt
                properties:
                  accessToken:
                    type: string
                    description: JWT de 15 minutos; en la web se guarda solo en memoria.
                  accessTokenExpiresAt:
                    type: string
                    format: date-time
                  refreshToken:
                    type: string
                    description: Solo para clientes mobile.
                  refreshTokenExpiresAt:
                    type: string
                    format: date-time
                  deviceId:
                    type: string
                    description: Solo para clientes mobile.
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /v1/auth/refresh:
    post:
      summary: Renovar la sesión (rota el refresh token)
      tags: *a2
      description: La web envía la cookie; mobile envía refreshToken en el cuerpo.
        Reusar un token ya usado revoca la sesión completa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  additionalProperties: false
                  required: []
                  properties:
                    refreshToken:
                      type: string
                      minLength: 16
                      maxLength: 128
                      pattern: ^[A-Za-z0-9_-]+$
                - type: "null"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - accessToken
                  - accessTokenExpiresAt
                properties:
                  accessToken:
                    type: string
                    description: JWT de 15 minutos; en la web se guarda solo en memoria.
                  accessTokenExpiresAt:
                    type: string
                    format: date-time
                  refreshToken:
                    type: string
                    description: Solo para clientes mobile.
                  refreshTokenExpiresAt:
                    type: string
                    format: date-time
                  deviceId:
                    type: string
                    description: Solo para clientes mobile.
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /v1/auth/logout:
    post:
      summary: Cerrar esta sesión (HU17.3)
      tags: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  additionalProperties: false
                  required: []
                  properties:
                    refreshToken:
                      type: string
                      minLength: 16
                      maxLength: 128
                      pattern: ^[A-Za-z0-9_-]+$
                - type: "null"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /v1/auth/logout-all:
    post:
      summary: Cerrar todas las sesiones (HU17.3)
      tags: *a2
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /v1/auth/password-reset:
    post:
      summary: Pedir un enlace para restablecer la contraseña (HU17.2)
      tags: *a2
      description: La respuesta es la misma exista o no la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - message
                properties:
                  message:
                    type: string
  /v1/auth/password-reset/confirm:
    post:
      summary: Elegir una nueva contraseña con el enlace (HU17.2)
      tags: *a2
      description: El enlace sirve una vez y vence en 30 minutos; el cambio cierra
        todas las sesiones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]+$
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        "204":
          description: Default Response
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
