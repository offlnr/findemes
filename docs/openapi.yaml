  /v1/projection:
    get:
      summary: Proyección de mi flujo de caja y salud financiera (HU05, HU39)
      tags: *a5
      description: Se recalcula en cada consulta desde el registro. Horizonte
        configurable de 1 a 36 meses (por defecto 12). No emite recomendaciones.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,2}$
          in: query
          name: months
          required: false
      security: *a6
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - startMonth
                  - horizonMonths
                  - base
                  - explanation
                properties:
                  startMonth:
                    type: string
                    pattern: ^\d{4}-(0[1-9]|1[0-2])$
                    examples:
                      - 2026-11
                  horizonMonths:
                    type: integer
                  base:
                    type: object
                    properties:
                      months:
                        type: array
                        items:
                          type: object
                          properties:
                            month:
                              type: string
                              pattern: ^\d{4}-(0[1-9]|1[0-2])$
                              examples:
                                - 2026-11
                            openingBalance:
                              type: integer
                            income:
                              type: integer
                            expenses:
                              type: integer
                            debtPayments:
                              type: integer
                            netFlow:
                              type: integer
                            closingBalance:
                              type: integer
                          required:
                            - month
                            - openingBalance
                            - income
                            - expenses
                            - debtPayments
                            - netFlow
                            - closingBalance
                          additionalProperties: false
                      indicators:
                        type: object
                        description: Indicadores de la Tabla 12.
                        properties:
                          minimumProjectedBalance:
                            type: object
                            description: Saldo mínimo proyectado y primer mes en que ocurre.
                            properties:
                              amount:
                                type: integer
                              month:
                                type: string
                                pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                examples:
                                  - 2026-11
                            required:
                              - amount
                              - month
                            additionalProperties: false
                          breakMonth:
                            anyOf:
                              - type: string
                                pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                examples:
                                  - 2026-11
                              - type: "null"
                            description: Primer mes con saldo negativo; null si no ocurre.
                          monthlyAvailableMargin:
                            type: array
                            items:
                              type: object
                              properties:
                                month:
                                  type: string
                                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                  examples:
                                    - 2026-11
                                amount:
                                  type: integer
                              required:
                                - month
                                - amount
                              additionalProperties: false
                            description: Ingresos menos compromisos totales de cada mes.
                          debtToIncome:
                            type: array
                            description: Puntos básicos enteros (10 000 = 100 %); null si el mes no tiene
                              ingresos.
                            items:
                              type: object
                              properties:
                                month:
                                  type: string
                                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                                  examples:
                                    - 2026-11
                                basisPoints:
                                  anyOf:
                                    - type: integer
                                    - type: "null"
                              required:
                                - month
                                - basisPoints
                              additionalProperties: false
                        required:
                          - minimumProjectedBalance
                          - breakMonth
                          - monthlyAvailableMargin
                          - debtToIncome
                        additionalProperties: false
                    required:
                      - months
                      - indicators
                    additionalProperties: false
                  explanation:
                    type: object
                    properties:
                      summary:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                      - summary
                      - details
                    additionalProperties: false
